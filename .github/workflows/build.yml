
name: Build BroChat

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -o BroChat-source-project.zip

      - name: Fix Compose compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("BroChat/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false',
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
          )
          p.write_text(s)

          p = Path("BroChat/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'id("org.jetbrains.kotlin.android")',
              'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
          )
          s = s.replace(
              '    composeOptions { kotlinCompilerExtensionVersion = "1.5.15" }\n', ''
          )
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: BroChat
          arguments: assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BroChat-APK
          path: BroChat/app/build/outputs/apk/debug/app-debug.apk

