      - name: Fix Compose and Java versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("BroChat/build.gradle.kts")
          s = p.read_text()
          line = '    id("org.jetbrains.kotlin.android") version "2.0.21" apply false'
          if 'id("org.jetbrains.kotlin.plugin.compose")' not in s:
              s = s.replace(line, line + '\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false')
          p.write_text(s)

          p = Path("BroChat/app/build.gradle.kts")
          s = p.read_text()

          if 'id("org.jetbrains.kotlin.plugin.compose")' not in s:
              s = s.replace(
                  'id("org.jetbrains.kotlin.android")',
                  'id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
              )

          import re
          s = re.sub(
              r'    composeOptions\s*\{[^}]*\}\s*',
              '',
              s
          )

          if 'compileOptions {' not in s:
              s = s.replace(
                  'android {\n',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          ''',
                  1
              )

          p.write_text(s)
          PY
